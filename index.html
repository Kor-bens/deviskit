<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DevisKit — Devis et factures pour indépendants</title>
  <meta name="description" content="Créez des devis professionnels et des factures conformes en 2 minutes. Micro-SaaS pour freelances et TPE." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="app"></div>
  <div id="toast" class="toast"></div>
  <div id="paywall" class="modal-bg" onclick="if(event.target===this)closePaywall()">
    <div class="modal">
      <h3 style="font-family:var(--display);font-size:28px;margin-bottom:8px">Passez Pro</h3>
      <p class="muted">La version gratuite est limitée à 5 documents. À 9 €/mois, plus de plafond — et un vrai outil de suivi.</p>
      <div style="display:flex;gap:8px;margin-top:18px">
        <button class="btn gold" onclick="upgrade('pro')">Activer Pro (démo)</button>
        <button class="btn ghost" onclick="closePaywall()">Plus tard</button>
      </div>
    </div>
  </div>
  <script src="js/core.js"></script>
  <script src="js/landing.js"></script>
  <script src="js/ui-lists.js"></script>
  <script src="js/ui-editor.js"></script>
  <script src="js/ui-actions.js"></script>
</body>
</html>
